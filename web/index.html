<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>saumux — terminal desktop</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/xterm.js"></script>
  <script defer src="/vendor/addon-fit.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <header>
    <strong>saumux</strong>
    <nav aria-label="Browser controls">
      <button data-key="F10" title="Open the desktop menus">Menus</button>
      <button data-key="n" data-alt title="New shell (Alt+n)">+ Shell</button>
      <button data-key="g" data-ctrl title="Agent attention (Ctrl+g)">Attention</button>
      <button data-key="p" data-alt title="Saved projects (Alt+p)">Projects</button>
      <button data-key="t" data-alt title="Colour themes (Alt+t)">Themes</button>
      <button id="copy" title="Copy the latest saumux selection to this computer">Copy</button>
      <button id="paste" title="Paste text from this computer">Paste</button>
      <button id="reconnect">Reconnect</button>
    </nav>
    <span id="status" role="status" aria-live="polite">Connecting…</span>
  </header>
  <main id="terminal" aria-label="saumux terminal desktop"></main>
  <dialog id="paste-dialog">
    <form method="dialog">
      <label for="paste-text">Paste into the active window</label>
      <textarea id="paste-text" rows="7" spellcheck="false" placeholder="Paste text here with Ctrl+V or Command+V"></textarea>
      <div><button value="cancel">Cancel</button><button id="send-paste" value="send">Send text</button></div>
    </form>
  </dialog>
</body>
</html>
