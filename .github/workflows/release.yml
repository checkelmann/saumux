name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py validate "$RELEASE_TAG"
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: saumux-*
          path: dist
          merge-multiple: true
      - name: Verify archives and assemble checksums
        run: |
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 4
          cat dist/*.sha256 > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --draft --title "saumux $RELEASE_TAG" \
            --generate-notes "${prerelease[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
