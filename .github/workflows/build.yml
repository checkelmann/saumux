name: Build and test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build and test programs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools vim htop
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --target '${{ matrix.target }}' -- -D warnings
      - run: cargo test --locked --target '${{ matrix.target }}'
      - name: Build release executable
        run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Check real client terminal lifecycle
        run: python3 tests/client_pty.py 'target/${{ matrix.target }}/release/saumux'
      - name: Validate packaging helpers
        run: python3 -m unittest discover -s tests -p 'release_*.py'
      - name: Package executable, documentation and terminfo
        run: >-
          python3 scripts/release.py package
          --target '${{ matrix.target }}'
          --binary 'target/${{ matrix.target }}/release/saumux'
          --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saumux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
