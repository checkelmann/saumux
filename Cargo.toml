[package]
name = "saumux"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A retro text-mode desktop and terminal multiplexer"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["serde"] }
portable-pty = "0.9"
vt100 = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
unicode-width = "0.2"
base64 = "0.22"
libc = "0.2"
signal-hook = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "signal", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
